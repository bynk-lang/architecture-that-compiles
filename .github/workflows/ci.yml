name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Newer Bynk releases are checked by bynk-canary.yml, which the org canary in
# bynk-lang/.github dispatches on each release (and weekly).

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manuscript:
    # Typeset the manuscript with the pinned Typst toolchain. The wrapper
    # verifies the vendored Source fonts, downloads only the pinned Typst
    # release when needed, and ignores runner-installed fonts.
    name: Print book (Typst)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the pinned Typst toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/toolchain
          # Hashing the wrapper keys the cache on its Typst version and platform
          # digests without duplicating those values in this workflow.
          key: typst-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-book.sh') }}
      - name: Build the manuscript
        run: ./scripts/build-book.sh
      - name: Upload the manuscript PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bynk-manuscript
          path: output/pdf/bynk-manuscript.pdf
          if-no-files-found: error
          retention-days: 14

  snippets:
    # The manuscript's Bynk listings at the pinned release (snippets.yml).
    name: Snippets (pinned release)
    uses: ./.github/workflows/snippets.yml
